name: Pruebas
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Pruebas del servidor y de la interfaz
        run: npm test
      - name: Compilar la app de Mac (sin firmar)
        run: cd mac && swift build -c release
